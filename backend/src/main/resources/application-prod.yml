# ─────────────────────────────────────────────────────────────────────────────
# 운영 환경 설정 오버라이드
#
# 활성화 방법: SPRING_PROFILES_ACTIVE=prod 환경변수 설정
# 이 파일은 application.yml 위에 덮어씌워집니다.
# 모든 값은 환경변수로만 주입 — 하드코딩 금지
# ─────────────────────────────────────────────────────────────────────────────
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis: {}
  flyway:
    repair-on-migrate: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
