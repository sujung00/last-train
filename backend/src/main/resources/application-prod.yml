# ─────────────────────────────────────────────────────────────────────────────
# 운영 환경 설정 오버라이드
#
# 활성화 방법: SPRING_PROFILES_ACTIVE=prod 환경변수 설정
# 이 파일은 application.yml 위에 덮어씌워집니다.
# 모든 값은 환경변수로만 주입 — 하드코딩 금지
# ─────────────────────────────────────────────────────────────────────────────

spring:
  jpa:
    hibernate:
      # 운영에서는 스키마 자동 변경 금지 — 마이그레이션 툴(Flyway 등) 사용 권장
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      # 운영 Redis는 반드시 비밀번호 설정
      password: ${REDIS_PASSWORD}

# ── Swagger 비활성화 ──────────────────────────────────────────────────────────
# 운영 환경에서 Swagger 노출 금지 (API 구조 공개 위험)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ── CORS 운영 도메인 ──────────────────────────────────────────────────────────
# SecurityConfig에서 CORS 설정 시 아래 값 참조
# 예: @Value("${cors.allowed-origins}") 로 주입
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}