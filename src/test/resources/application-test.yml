spring:
  # ── DataSource ──────────────────────────────────────────────────────────────
  # TestContainers가 @DynamicPropertySource로 url/username/password를 주입하므로
  # 여기서는 값을 지정하지 않는다.
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ── JPA ─────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      # create-drop: 테스트 시작 시 테이블 생성, 종료 시 삭제
      # 매 테스트 컨텍스트마다 깨끗한 스키마 보장
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  # ── Redis ────────────────────────────────────────────────────────────────────
  # 단위 테스트: Redis 의존성 없는 테스트는 이 설정 그대로 사용
  # Redis 통합 테스트 필요 시: testcontainers:redpanda 또는 embedded-redis 추가 후
  # @DynamicPropertySource로 host/port를 동적 주입
  data:
    redis:
      host: localhost
      port: 6379
