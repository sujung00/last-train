# ──────────────────────────────────────────────────────────────────────────────
# Redis 설정 — 막차 알리미 (Last Train Notifier)
#
# 목적: notification:queue ZSET이 Redis 재시작 후에도 유실되지 않도록
#       AOF(Append Only File) 방식의 영속성을 활성화한다.
# ──────────────────────────────────────────────────────────────────────────────

# ── AOF 영속성 ────────────────────────────────────────────────────────────────
# appendonly yes: 모든 쓰기 명령을 appendonly.aof 파일에 순차 기록
# Redis 재시작 시 이 파일을 재실행해서 데이터를 복원한다.
appendonly yes

# appendfsync everysec: 1초마다 OS 버퍼를 디스크에 flush
# - always  : 매 명령마다 flush → 데이터 손실 없음, 성능 저하 큼
# - everysec : 1초마다 flush    → 최대 1초치 데이터 손실 가능, 성능/안전 균형
# - no       : OS가 결정        → 빠르지만 장애 시 손실 큼
# 막차 알림 서비스 특성(초단위 정확도 필요, 금융 수준 무손실 불필요)에서 everysec가 적합하다.
appendfsync everysec

# AOF + RDB 하이브리드 모드: AOF 파일 앞부분을 RDB 스냅샷으로 압축 저장
# 재시작 복구 속도가 순수 AOF보다 빠르다.
aof-use-rdb-preamble yes

# ── 네트워크 ──────────────────────────────────────────────────────────────────
# Docker 컨테이너 내부에서 모든 인터페이스 바인딩
bind 0.0.0.0

# ── 메모리 ────────────────────────────────────────────────────────────────────
# 최대 메모리 초과 시 LRU로 만료된 키 우선 제거
# notification:queue처럼 TTL 없는 키는 제거 대상에서 제외된다.
maxmemory-policy allkeys-lru
