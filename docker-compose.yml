# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — 막차 알리미 로컬 개발 환경
#
# 포함 서비스: MySQL 8, Redis 7
# Spring Boot 앱은 IntelliJ에서 직접 실행하는 것을 가정한다.
#
# 실행 방법:
#   cp .env.example .env   # 처음 한 번만
#   docker compose up -d
#
# 종료:
#   docker compose down
#
# 데이터 완전 초기화:
#   docker compose down -v
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── MySQL 8 ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: last-train-mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-last_train_db}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: last-train-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # docker/redis/redis.conf를 컨테이너 내부로 마운트해서 AOF 설정 적용
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data   # AOF 파일(appendonly.aof)이 저장되는 위치
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  redis-data:
