# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — 막차 알리미 로컬 개발 환경
#
# 포함 서비스: MySQL 8, Redis 7, Spring Boot 앱(app)
#
# 실행 방법:
#   cp .env.example .env   # 처음 한 번만, 실제 값 입력
#   docker compose up -d --build
#
# 종료:
#   docker compose down
#
# 데이터 완전 초기화:
#   docker compose down -v
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── MySQL 8 ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: last-train-mysql
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-last_train_db}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-healthcheck.sh:/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: last-train-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # docker/redis/redis.conf를 컨테이너 내부로 마운트해서 AOF 설정 적용
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data   # AOF 파일(appendonly.aof)이 저장되는 위치
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot 앱 ────────────────────────────────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: last-train-app
    ports:
      - "8080:8080"
    # .env 파일의 모든 값을 기본으로 주입한다.
    env_file:
      - .env
    # mysql, redis는 도커 네트워크 안에서 서비스 이름으로 접근해야 하므로
    # .env의 localhost 기준 값(IntelliJ 직접 실행용)을 컨테이너 내부 전용 값으로 덮어쓴다.
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
